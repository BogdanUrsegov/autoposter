services:
  postgres:
    image: postgres:16-alpine
    container_name: autoposter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clickbot}
      POSTGRES_USER: ${POSTGRES_USER:-clickbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clickbot} -d ${POSTGRES_DB:-clickbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autoposter

  db_restore:
    image: postgres:16-alpine
    container_name: autoposter-db-restore
    restart: "no"
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-clickbot}
      PGUSER: ${POSTGRES_USER:-clickbot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./clickbot_dump.dump:/backup/clickbot_dump.dump:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /backup/clickbot_dump.dump ]; then
          echo 'ERROR: clickbot_dump.dump не найден рядом с docker-compose.yml'
          exit 1
        fi

        TABLE_EXISTS=$$(psql -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='users')")
        if [ "$$TABLE_EXISTS" = "t" ]; then
          echo 'PostgreSQL уже содержит таблицу users — восстановление пропущено.'
          exit 0
        fi

        echo 'Пустая PostgreSQL — начинаю восстановление clickbot_dump.dump...'
        pg_restore --no-owner --no-privileges --clean --if-exists --exit-on-error -d "$$PGDATABASE" /backup/clickbot_dump.dump
        echo 'Восстановление PostgreSQL завершено.'
    networks:
      - autoposter

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoposter-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clickbot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-clickbot}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
    depends_on:
      db_restore:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    networks:
      - autoposter

volumes:
  postgres_data:
  app_data:
  app_logs:

networks:
  autoposter:
    driver: bridge
